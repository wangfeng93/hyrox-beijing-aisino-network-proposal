  .auto-scan-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;margin-top:46px}.auto-panel{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:20px}.auto-panel h3{margin:0;font-size:21px}.auto-panel p{margin:9px 0 0;color:#9ba3a6;font-size:12px}.auto-node-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}.auto-node{display:grid;grid-template-columns:11px 1fr auto;align-items:center;gap:9px;padding:11px 12px;border-radius:11px;background:#101314;border:1px solid rgba(255,255,255,.08);font-size:11px;color:#c5cbcd}.auto-node i{width:9px;height:9px;border-radius:50%;background:#566166}.auto-node b{font-size:9px;color:#7f898c}.auto-node.scanning{border-color:#fff}.auto-node.scanning i{background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.12)}.auto-node.ok i{background:var(--green)}.auto-node.issue{border-color:rgba(228,30,43,.5)}.auto-node.issue i{background:var(--red)}.auto-mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:16px}.auto-mode{border:1px solid rgba(255,255,255,.14);border-radius:10px;background:#101314;color:#cbd1d3;padding:9px 8px;cursor:pointer;font-size:10px;font-weight:850}.auto-mode.active,.auto-mode:hover{background:var(--yellow);color:#080808;border-color:var(--yellow)}.auto-scan-btn{width:100%;min-height:46px;margin-top:12px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;font-weight:950;cursor:pointer}.auto-scan-btn:disabled{opacity:.55;cursor:wait}.auto-progress{height:6px;margin-top:13px;background:#242a2c;border-radius:999px;overflow:hidden}.auto-progress span{display:block;width:0;height:100%;background:var(--yellow);transition:width .22s}.auto-state{display:flex;justify-content:space-between;gap:10px;margin-top:9px;color:#7f898c;font-size:10px}.auto-log{display:grid;gap:6px;margin-top:13px;max-height:205px;overflow:auto}.auto-log div{padding:8px 9px;border-radius:9px;background:#101314;color:#a7b0b2;font-size:10px}.auto-log div.ok{border-left:3px solid var(--green)}.auto-log div.issue{border-left:3px solid var(--red)}.auto-log div.action{border-left:3px solid var(--yellow);color:#f6edaa}.auto-result{margin-top:12px;padding:14px;border-radius:12px;background:rgba(46,157,232,.08);border:1px solid rgba(46,157,232,.23);color:#cfeaff;font-size:11px}.auto-disclaimer{margin-top:10px;color:#717a7e;font-size:9px}@media(max-width:900px){.auto-scan-grid{grid-template-columns:1fr}}@media(max-width:560px){.auto-node-grid,.auto-mode-grid{grid-template-columns:1fr}}
  #reference .reference-image img{width:100%;max-height:650px;object-fit:contain;background:#fff}
  `;
  doc.head.appendChild(style);

  const ref=doc.getElementById('reference');
  if(ref){ref.innerHTML=`<div class="container"><div class="eyebrow">Beijing network requirement baseline</div><h2 class="heading">北京冰丝带网络需求，<br>直接进入<span class="blue">本次方案基线</span></h2><p class="lead">依据北京赛事 General Plan，当前共识别 26 个网络 / 业务区域。图纸标称带宽简单加总约 340M；最终出口规格仍需结合海外 API、长时直播、媒体并发和现场实测确定。</p><div class="reference-grid reveal visible"><figure class="reference-image"><span class="reference-label">北京冰丝带 · General Plan</span><img id="beijingPlanImage" src="${beijingImage}" alt="HYROX 北京冰丝带网络需求布局图（公开版）" /></figure><div class="reference-panel"><div class="ref-stat"><strong>26</strong><span>北京图纸识别的网络 / 业务区域</span></div><div class="ref-stat"><strong>≈340M</strong><span>图纸标称带宽简单加总，不等同最终出口规格</span></div><div class="ref-stat"><strong>14</strong><span>赞助商独立无线网络，每个 10M</span></div><div class="ref-stat"><strong>P0</strong><span>Check-in / Finish / Timing / LapScreen / Timing Photo</span></div><div class="ref-warning"><strong>北京关键接入：</strong>媒体区要求有线 + 无线；注册区要求有线 + 无线；Finish-Stage、LapScreen、Timing-Photo 明确采用有线。公开汇报页不展示网络密码，凭据单独受控。</div></div></div></div>`;}

  const topology=doc.getElementById('topology');
  if(topology && !doc.getElementById('autoscan')){
    const section=doc.createElement('section');
    section.className='section dark2';section.id='autoscan';
    section.innerHTML=`<div class="container"><div class="eyebrow">Active node scan & automatic failover</div><h2 class="heading">主动扫描：系统先发现，<br>再判断<span class="yellow">是否需要切换</span></h2><p class="lead">持续探测跨境专线、双旁路、核心承载和真实业务。只有路径连续越过阈值并且备用路径健康时，才自动择优切换；如果网络路径健康而业务链异常，则进入分段诊断，不盲目切网。</p><div class="auto-scan-grid reveal visible"><div class="auto-panel"><h3>主动健康扫描</h3><p>依次检查路径、策略、核心与 P0 业务探针。扫描结果会同步反映到上方动态拓扑。</p><div class="auto-node-grid"><div class="auto-node" data-auto="private"><i></i><span>跨境专线</span><b>WAIT</b></div><div class="auto-node" data-auto="routeA"><i></i><span>旁路路由 A</span><b>WAIT</b></div><div class="auto-node" data-auto="routeB"><i></i><span>旁路路由 B</span><b>WAIT</b></div><div class="auto-node" data-auto="policy"><i></i><span>应用级路由策略</span><b>WAIT</b></div><div class="auto-node" data-auto="core"><i></i><span>锐捷出口与核心</span><b>WAIT</b></div><div class="auto-node" data-auto="health"><i></i><span>网络健康运营平台</span><b>WAIT</b></div><div class="auto-node" data-auto="checkin"><i></i><span>Check-in 业务探针</span><b>WAIT</b></div><div class="auto-node" data-auto="screen"><i></i><span>LapScreen 业务链</span><b>WAIT</b></div></div><div class="auto-progress"><span id="autoProgress"></span></div><div class="auto-state"><span id="autoState">等待扫描</span><b id="autoCount">0 / 8</b></div><div class="auto-log" id="autoLog"><div>选择右侧场景后，点击“开始主动扫描”。</div></div></div><div class="auto-panel"><h3>故障判断与动作</h3><p>用场景演示“发现异常后做什么”，重点不是动画，而是避免误切。</p><div class="auto-mode-grid"><button class="auto-mode active" data-auto-mode="normal">全部正常</button><button class="auto-mode" data-auto-mode="private">跨境专线劣化</button><button class="auto-mode" data-auto-mode="routeA">旁路 A 承载故障</button><button class="auto-mode" data-auto-mode="business">大屏业务链异常</button></div><button class="auto-scan-btn" id="autoScanBtn">开始主动扫描</button><div class="auto-result" id="autoResult"><strong>READY</strong><br>扫描完成后，系统将给出“保持、切换或进入业务诊断”的判断。</div><div class="policy-steps"><div class="policy-step"><span>1</span><div>节点探测：可达性、时延、丢包、抖动与下一跳</div></div><div class="policy-step"><span>2</span><div>业务探测：Sports Pro API、注册、大屏刷新等真实结果</div></div><div class="policy-step"><span>3</span><div>连续越过阈值后判定，加入防抖避免路由震荡</div></div><div class="policy-step"><span>4</span><div>切换后复验关键业务，失败则升级人工处置</div></div></div><div class="auto-disclaimer">该片段用于说明主动扫描与自动择优逻辑。生产上线前需在北京现场确定实际探针、设备控制接口、阈值、连续失败次数、Hold-down 和回切策略。</div></div></div></div>`;
    topology.insertAdjacentElement('afterend',section);

    const nav=doc.querySelector('.nav-links');
    if(nav){const li=doc.createElement('li');li.innerHTML='<a href="#autoscan">主动扫描</a>';const topoLi=[...nav.children].find(x=>x.textContent.includes('动态拓扑'));topoLi?topoLi.insertAdjacentElement('afterend',li):nav.appendChild(li);}

    let mode='normal',busy=false;
    const order=[['private','node-private'],['routeA','node-routeA'],['routeB','node-routeB'],['policy','node-policy'],['core','node-core'],['health','node-health'],['checkin','node-checkin'],['screen','node-screen']];
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    const $=id=>doc.getElementById(id);
    const log=(t,c='')=>{const d=doc.createElement('div');d.className=c;d.innerHTML=t;$('autoLog').appendChild(d);$('autoLog').scrollTop=$('autoLog').scrollHeight;};
    function reset(){doc.querySelectorAll('.auto-node').forEach(n=>{n.className='auto-node';n.querySelector('b').textContent='WAIT'});doc.querySelectorAll('.net-node').forEach(n=>n.classList.remove('auto-scanning','auto-ok','auto-issue'));$('autoProgress').style.width='0';$('autoCount').textContent='0 / 8';$('autoState').textContent='等待扫描';$('autoLog').innerHTML='<div>场景已选择，等待开始扫描。</div>';}
    function choose(m){if(busy)return;mode=m;doc.querySelectorAll('.auto-mode').forEach(b=>b.classList.toggle('active',b.dataset.autoMode===m));reset();$('autoResult').innerHTML='<strong>READY</strong><br>系统将先扫描，再决定是否动作。';}
    function clickScenario(name){const b=doc.querySelector('.scenario-btn[data-scenario="'+name+'"]');if(b)b.click();}
    function annotateTopology(badge,title,text){const b=$('scenarioBadge'),t=$('scenarioTitle'),p=$('scenarioText');if(b)b.textContent=badge;if(t)t.textContent=title;if(p)p.textContent=text;}
    async function scan(){if(busy)return;busy=true;$('autoScanBtn').disabled=true;reset();$('autoLog').innerHTML='';const bad=mode==='private'?'private':mode==='routeA'?'routeA':mode==='business'?'screen':null;for(let i=0;i<order.length;i++){const [key,nodeId]=order[i],row=doc.querySelector('.auto-node[data-auto="'+key+'"]'),node=$(nodeId);row.classList.add('scanning');row.querySelector('b').textContent='SCAN';if(node)node.classList.add('auto-scanning');$('autoState').textContent='扫描：'+row.querySelector('span').textContent;$('autoCount').textContent=(i+1)+' / 8';$('autoProgress').style.width=((i+1)/8*100)+'%';await sleep(330);row.classList.remove('scanning');if(node)node.classList.remove('auto-scanning');if(key===bad){row.classList.add('issue');row.querySelector('b').textContent='ISSUE';if(node)node.classList.add('auto-issue');log('<strong>'+row.querySelector('span').textContent+'</strong> · 连续探测异常','issue')}else{row.classList.add('ok');row.querySelector('b').textContent='OK';if(node)node.classList.add('auto-ok');log('<strong>'+row.querySelector('span').textContent+'</strong> · 健康','ok')}await sleep(70)}$('autoState').textContent='扫描完成 · 正在判定';await sleep(420);if(mode==='normal'){clickScenario('normal');log('<strong>判定：</strong>所有路径与业务探针正常，保持当前优选路径。','ok');$('autoResult').innerHTML='<strong>HEALTHY · 不切换</strong><br>没有异常证据，不进行无意义的路径切换。';}else if(mode==='private'){clickScenario('api');annotateTopology('AUTO FAILOVER','跨境专线持续劣化，旁路 A 自动接管','主动扫描确认跨境主路径连续越过阈值，同时旁路 A 健康；策略完成切换后继续复验 Sports Pro / 注册 API。');log('<strong>判定：</strong>主路径持续劣化，旁路 A 健康。','issue');log('<strong>动作：</strong>自动切换至旁路 A，并复验 Sports Pro / 注册 API。','action');$('autoResult').innerHTML='<strong>FAILOVER · 自动择优</strong><br>跨境专线异常 → 旁路 A 接管 → 关键业务复验。';}else if(mode==='routeA'){clickScenario('routeFault');annotateTopology('AUTO FAILOVER','旁路 A 承载中故障，旁路 B 自动接管','主动扫描确认旁路 A 失效；旁路 B 通过健康检查后接管，避免旁路本身形成新的单点。');log('<strong>判定：</strong>旁路 A 承载中故障，旁路 B 健康。','issue');log('<strong>动作：</strong>旁路 B 自动接管，并验证业务连续性。','action');$('autoResult').innerHTML='<strong>FAILOVER · 旁路 B 接管</strong><br>旁路 A 故障 → 旁路 B 接管 → 业务复验。';}else{clickScenario('screen');annotateTopology('BUSINESS DIAGNOSIS','网络路径健康，大屏业务链异常','节点扫描确认路由路径健康，因此不执行无证据切换；系统转入“芯片 → 后台 → API → 大屏”的分段业务诊断。');log('<strong>判定：</strong>路由节点健康，LapScreen 业务链异常。','issue');log('<strong>动作：</strong>不切路由，进入芯片 / 后台 / API / 大屏分段诊断。','action');$('autoResult').innerHTML='<strong>DIAGNOSED · 不盲目切网</strong><br>网络健康但业务异常，进入业务链定位，避免自动化制造第二次故障。';}$('autoState').textContent='完成 · 已记录事件';busy=false;$('autoScanBtn').disabled=false;}
    doc.querySelectorAll('.auto-mode').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.autoMode)));$('autoScanBtn').addEventListener('click',scan);
  }
  document.body.classList.add('ready');
});
</script>
